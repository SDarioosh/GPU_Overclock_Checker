name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install a CPU OpenCL runtime (runs the real stress kernels in tests)
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd ocl-icd-libopencl1
      - run: dotnet test -c Release

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - run: dotnet publish src/GpuOcChecker -c Release -r win-x64 -o publish
      - name: Smoke test
        run: |
          publish\GpuOcChecker.exe help
          publish\GpuOcChecker.exe stress --simulate undervolt --minutes 1 -y --no-crash-check; if ($LASTEXITCODE -ne 2) { throw "expected UNSTABLE (exit 2), got $LASTEXITCODE" }
          exit 0
        env:
          GPUOC_HOME: ${{ runner.temp }}\gpuoc
      - uses: actions/upload-artifact@v4
        with:
          name: GpuOcChecker-win-x64
          path: publish/GpuOcChecker.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/GpuOcChecker.exe
